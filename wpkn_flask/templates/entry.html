<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPKN Record Library — Data Entry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>WPKN 89.5 FM Record Library</h1>
        <nav>
            <a href="/" class="nav-btn">Search</a>
            {% if current_user.role in ('Librarian', 'Admin') %}
            <a href="/edit" class="nav-btn">Edit Record</a>
            <a href="/bulk_edit" class="nav-btn">Bulk Edit</a>
            {% endif %}
            {% if current_user.role == 'Admin' %}
            <a href="/admin" class="nav-btn">Admin</a>
            {% endif %}
            <span class="nav-user">{{ current_user.username }} ({{ current_user.role }})</span>
            <a href="/logout" class="nav-btn">Log Out</a>
        </nav>
    </header>
    <main>
        <h2>Data Entry</h2>

        {% if message %}
        <div class="entry-message {{ message_type }}">{{ message }}</div>
        {% endif %}

        <form id="entry-form" method="POST" action="/entry">
            <div class="entry-grid">

                <div class="entry-row">
                    <div class="field">
                        <label for="media_type">Media Type <span class="required">*</span></label>
                        <select id="media_type" name="media_type" required>
                            <option value="">(Select)</option>
                            {% for mt in media_types %}
                            <option value="{{ mt.ID }}">{{ mt.Media }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="field">
                        <label for="library_number">Library Number</label>
                        <input type="text" id="library_number" name="library_number"
                               class="readonly-field" readonly placeholder="Select media type">
                    </div>
                </div>

                <div class="entry-row full-width">
                    <div class="field">
                        <label for="artist">Artist <span class="required">*</span></label>
                        <input type="text" id="artist" name="artist" required autocomplete="off">
                    </div>
                </div>

                <div class="entry-row full-width">
                    <div class="field">
                        <label for="title">Title <span class="required">*</span></label>
                        <input type="text" id="title" name="title" required autocomplete="off">
                    </div>
                </div>

                <div class="entry-row">
                    <div class="field">
                        <label for="label">Label</label>
                        <input type="text" id="label" name="label" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="genre">Genre</label>
                        <select id="genre" name="genre">
                            <option value="">(None)</option>
                            {% for g in genres %}
                            <option value="{{ g }}">{{ g }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="entry-row">
                    <div class="field">
                        <label for="style">Style</label>
                        <input type="text" id="style" name="style" autocomplete="off">
                    </div>
                </div>

                <div class="entry-row">
                    <div class="field">
                        <label for="release_date">Release Date</label>
                        <input type="date" id="release_date" name="release_date">
                    </div>
                    <div class="field">
                        <label for="release_year">Release Year</label>
                        <input type="number" id="release_year" name="release_year"
                               min="1900" max="2099" style="width:100px;">
                    </div>
                </div>

            </div>

            <div class="entry-actions">
                <button type="submit" class="primary-btn">Save</button>
                <button type="button" id="cancel-btn" class="secondary-btn">Cancel</button>
            </div>
        </form>
    </main>

    <script>
        document.getElementById('media_type').addEventListener('change', function () {
            var id = this.value;
            var libInput = document.getElementById('library_number');
            if (!id) { libInput.value = ''; return; }
            libInput.value = 'Loading...';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/next_library_number?media_type=' + id);
            xhr.onload = function () {
                var data = JSON.parse(xhr.responseText);
                libInput.value = data.next_number;
            };
            xhr.send();
        });

        document.getElementById('release_date').addEventListener('change', function () {
            if (this.value) {
                document.getElementById('release_year').value = this.value.substring(0, 4);
            }
        });

        document.getElementById('release_year').value = {{ current_year }};
    </script>
</body>
</html>
