<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPKN Record Library — Edit Record</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>WPKN 89.5 FM Record Library</h1>
        <nav>
            <a href="/" class="nav-btn">Search</a>
            <a href="/entry" class="nav-btn">Data Entry</a>
            <a href="/bulk_edit" class="nav-btn">Bulk Edit</a>
            {% if current_user.role == 'Admin' %}
            <a href="/admin" class="nav-btn">Admin</a>
            {% endif %}
            <span class="nav-user">{{ current_user.username }} ({{ current_user.role }})</span>
            <a href="/logout" class="nav-btn">Log Out</a>
        </nav>
    </header>
    <main>
        <h2>Edit Record</h2>

        {% if message %}
        <div class="entry-message {{ message_type }}">{{ message }}</div>
        {% endif %}

        <form method="POST" action="/edit">
            <input type="hidden" name="action" value="search">
            <div class="search-panel">
                <div class="field">
                    <label for="search_media_type">Media Type</label>
                    <select id="search_media_type" name="search_media_type">
                        <option value="">(Select)</option>
                        {% for mt in media_types %}
                        <option value="{{ mt.ID }}"
                            {% if search_media_type == mt.ID|string %}selected{% endif %}>
                            {{ mt.Media }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label for="search_library_number">Library Number</label>
                    <input type="number" id="search_library_number" name="search_library_number"
                           value="{{ search_library_number }}" min="1" style="width:120px;">
                </div>
                <div class="field field-btn">
                    <label>&nbsp;</label>
                    <button type="submit" class="primary-btn">Find Record</button>
                </div>
            </div>
        </form>

        {% if record %}
        <form method="POST" action="/edit">
            <input type="hidden" name="action" value="update">
            <input type="hidden" name="record_id" value="{{ record.ID }}">

            <div class="entry-grid">

                <div class="entry-row">
                    <div class="field">
                        <label>Library Number</label>
                        <input type="text" value="{{ record.LibraryNumber }}" class="readonly-field" readonly>
                    </div>
                    <div class="field">
                        <label for="media_type">Media Type</label>
                        <select id="media_type" name="media_type">
                            {% for mt in media_types %}
                            <option value="{{ mt.ID }}"
                                {% if record.MediaType == mt.ID %}selected{% endif %}>
                                {{ mt.Media }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="field">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            {% for s in statuses %}
                            <option value="{{ s.ID }}"
                                {% if record.Status == s.ID %}selected{% endif %}>
                                {{ s.Status }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="entry-row full-width">
                    <div class="field">
                        <label for="artist">Artist <span class="required">*</span></label>
                        <input type="text" id="artist" name="artist"
                               value="{{ record.Artist }}" required autocomplete="off">
                    </div>
                </div>

                <div class="entry-row full-width">
                    <div class="field">
                        <label for="title">Title <span class="required">*</span></label>
                        <input type="text" id="title" name="title"
                               value="{{ record.Title }}" required autocomplete="off">
                    </div>
                </div>

                <div class="entry-row">
                    <div class="field">
                        <label for="label">Label</label>
                        <input type="text" id="label" name="label"
                               value="{{ record.Label or '' }}" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="genre">Genre</label>
                        <select id="genre" name="genre">
                            <option value="">(None)</option>
                            {% for g in genres %}
                            <option value="{{ g }}"
                                {% if record.Genre == g %}selected{% endif %}>
                                {{ g }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="entry-row">
                    <div class="field">
                        <label for="style">Style</label>
                        <input type="text" id="style" name="style"
                               value="{{ record.Style or '' }}" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="section">Section</label>
                        <input type="number" id="section" name="section"
                               value="{{ record.Section or '' }}" style="width:80px;">
                    </div>
                </div>

                <div class="entry-row">
                    <div class="field">
                        <label for="release_date">Release Date</label>
                        <input type="date" id="release_date" name="release_date"
                               value="{{ record.ReleaseDate.strftime('%Y-%m-%d') if record.ReleaseDate else '' }}">
                    </div>
                    <div class="field">
                        <label for="release_year">Release Year</label>
                        <input type="number" id="release_year" name="release_year"
                               value="{{ record.ReleaseYear or '' }}"
                               min="1900" max="2099" style="width:100px;">
                    </div>
                </div>

                <div class="entry-row full-width">
                    <div class="field">
                        <label for="comments">Comments</label>
                        <textarea id="comments" name="comments" rows="3">{{ record.Comments or '' }}</textarea>
                    </div>
                </div>

            </div>

            <div class="entry-actions">
                <button type="submit" class="primary-btn">Save</button>
                <a href="/edit" class="secondary-btn-link">Reset</a>
            </div>
        </form>

        <form method="POST" action="/edit" class="delete-form"
              onsubmit="return confirm('Mark this record as Deleted? It will no longer appear in DJ search but will be retained in the database.')">
            <input type="hidden" name="action" value="delete">
            <input type="hidden" name="record_id" value="{{ record.ID }}">
            <button type="submit" class="delete-btn">Delete</button>
        </form>
        {% endif %}
    </main>

    <script>
        var releaseDateEl = document.getElementById('release_date');
        if (releaseDateEl) {
            releaseDateEl.addEventListener('change', function () {
                if (this.value) {
                    document.getElementById('release_year').value = this.value.substring(0, 4);
                }
            });
        }
    </script>
</body>
</html>
